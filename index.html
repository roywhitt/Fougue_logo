function heart(x, y){ hearts.push({ x, y, t: 0, s: rnd(.7, 1.1), a: rnd(-1, 1) }); }

function update(dt, t){

// ---------- dessin ----------
const MOUTH = (() => { const p = RIG.smile[0].p; let x = 0, y = 0, n = p.length / 2; for (let i = 0; i < p.length; i += 2){ x += p[i]; y += p[i+1]; } return [x / n, y / n]; })();

const HEART = new Path2D('M0 9 C-14 0 -14 -11 -6 -11 C-2 -11 0 -7 0 -5 C0 -7 2 -11 6 -11 C14 -11 14 0 0 9 Z');
const ZED = new Path2D('M-6 -7 L6 -7 L-6 7 L6 7'), PURR = new Path2D('M-8 0 Q-4 -6 0 0 T8 0');

// ---------- caresses : tête, corps ou queue ----------
const HIT = new OffscreenCanvas(1, 1).getContext('2d');
function zoneAt(x, y){
